<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Laurentius Nathaniel, Full Stack Infrastructure Engineer. Good engineering makes software work. Great engineering makes it reliable.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1426"/>
      <stop offset="0.55" stop-color="#0b1a31"/>
      <stop offset="1" stop-color="#0f2342"/>
    </linearGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#4f8ef7"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8ef7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4f8ef7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4f8ef7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f8ef7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f8ef7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4f8ef7" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="reveal">
      <rect x="170" y="140" width="0" height="40">
        <animate attributeName="width" from="0" to="480" begin="0.9s" dur="1.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>

    <!-- isometric pod cube -->
    <symbol id="cube" viewBox="-20 -22 40 44" width="40" height="44">
      <polygon points="0,-20 18,-10 0,0 -18,-10" fill="#16305a" stroke="#4f8ef7" stroke-width="1.2"/>
      <polygon points="-18,-10 0,0 0,20 -18,10" fill="#0e2140" stroke="#4f8ef7" stroke-width="1.2"/>
      <polygon points="18,-10 0,0 0,20 18,10" fill="#122a4d" stroke="#4f8ef7" stroke-width="1.2"/>
      <path d="M-7,-10 L7,-10 M0,-14 L0,-6" stroke="#7fb0ff" stroke-width="1.2" opacity="0.8"/>
    </symbol>

    <style>
      .sans { font-family: 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif; }
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; }
      .up { opacity: 0; animation: up .8s cubic-bezier(.2,.7,.2,1) forwards; }
      @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
      @keyframes fade { to { opacity: 1; } }
      .twinkle { animation: tw 3s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
      .flow { stroke-dasharray: 4 8; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      .spark { stroke-dasharray: 420; stroke-dashoffset: 420; animation: spark 4s ease-in-out infinite; }
      @keyframes spark { 0% { stroke-dashoffset: 420; } 55%,100% { stroke-dashoffset: 0; } }
      .glowtext { animation: gt 3s ease-in-out infinite; }
      @keyframes gt { 0%,100% { filter: none; } 50% { filter: drop-shadow(0 0 8px #4f8ef7); } }
      .lbl { fill: #5b7299; animation: lbl 8s linear infinite; }
      @keyframes lbl { 0%,20% { fill: #9fc2ff; } 25%,100% { fill: #5b7299; } }
      .wave { animation: wave 6s linear infinite; }
      @keyframes wave { to { transform: translateX(-120px); } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <polygon points="0,0 230,0 0,150" fill="#13294b" opacity="0.45"/>
  <polygon points="1200,420 1040,420 1200,330" fill="#13294b" opacity="0.45"/>

  <!-- stars -->
  <g fill="#9fc2ff">
    <circle class="twinkle" cx="320" cy="40" r="1.4" style="animation-delay:.2s"/>
    <circle class="twinkle" cx="610" cy="70" r="1.2" style="animation-delay:1.1s"/>
    <circle class="twinkle" cx="900" cy="30" r="1.5" style="animation-delay:2s"/>
    <circle class="twinkle" cx="1150" cy="210" r="1.2" style="animation-delay:.7s"/>
    <circle class="twinkle" cx="660" cy="380" r="1.3" style="animation-delay:1.6s"/>
    <circle class="twinkle" cx="470" cy="22" r="1" style="animation-delay:2.4s"/>
  </g>

  <!-- world network (bottom left) -->
  <g opacity="0.75">
    <path id="arc1" d="M30,405 Q200,365 420,392" fill="none" stroke="#2a4a7f" stroke-width="1"/>
    <path id="arc2" d="M120,415 Q300,372 560,400" fill="none" stroke="#2a4a7f" stroke-width="1"/>
    <path id="arc3" d="M10,385 Q150,368 300,412" fill="none" stroke="#2a4a7f" stroke-width="1"/>
    <g fill="#4f8ef7">
      <circle cx="30" cy="405" r="3"/><circle cx="420" cy="392" r="3"/>
      <circle cx="120" cy="415" r="3"/><circle cx="560" cy="400" r="3"/>
      <circle cx="10" cy="385" r="3"/><circle cx="300" cy="412" r="3"/>
    </g>
    <g fill="#9fc2ff" filter="url(#glow)">
      <circle r="2.6"><animateMotion dur="4s" repeatCount="indefinite"><mpath xlink:href="#arc1"/></animateMotion></circle>
      <circle r="2.6"><animateMotion dur="5s" begin="1s" repeatCount="indefinite"><mpath xlink:href="#arc2"/></animateMotion></circle>
      <circle r="2.6"><animateMotion dur="3.5s" begin="2s" repeatCount="indefinite"><mpath xlink:href="#arc3"/></animateMotion></circle>
    </g>
  </g>

  <!-- identity -->
  <g class="up" style="animation-delay:.1s">
    <text class="sans" x="60" y="152" font-size="58" font-weight="300" fill="url(#mono)" letter-spacing="-4">LN</text>
    <rect x="150" y="98" width="1.5" height="70" fill="#4f8ef7" opacity="0.6"/>
  </g>
  <text class="sans up" x="172" y="128" font-size="28" font-weight="600" fill="#e6edf3" letter-spacing="6" style="animation-delay:.4s">LAURENTIUS NATHANIEL</text>
  <g clip-path="url(#reveal)">
    <text class="mono" x="172" y="164" font-size="17" fill="#7fa8e8" letter-spacing="1.5">Full Stack Infrastructure Engineer<tspan fill="#4f8ef7">_</tspan></text>
  </g>

  <!-- tagline -->
  <text class="sans up" x="60" y="248" font-size="30" font-weight="300" fill="#c9d1d9" style="animation-delay:1.8s">Good engineering makes software work.</text>
  <text class="sans up" x="60" y="292" font-size="30" fill="#c9d1d9" style="animation-delay:2.3s"><tspan font-weight="700" fill="#ffffff">Great engineering</tspan> makes it <tspan class="glowtext" font-weight="700" fill="#4f8ef7">reliable</tspan>.</text>
  <rect x="60" y="318" height="2" fill="#4f8ef7" width="0">
    <animate attributeName="width" from="0" to="56" begin="2.8s" dur=".6s" fill="freeze"/>
  </rect>
  <text class="mono up" x="60" y="358" font-size="12.5" fill="#7fa8e8" letter-spacing="2" style="animation-delay:3s">DEVOPS  ·  SRE  ·  CLOUD  ·  SECURITY  ·  PLATFORM ENGINEERING</text>

  <!-- cluster illustration -->
  <g class="fade" style="animation-delay:.6s">
    <ellipse cx="820" cy="250" rx="170" ry="90" fill="url(#halo)"/>

    <!-- server stack -->
    <polygon points="820,262 930,317 820,372 710,317" fill="none" stroke="#1f3a66"/>
    <polygon points="820,246 930,301 820,356 710,301" fill="#0c1c35" stroke="#24467a"/>
    <polygon points="820,230 930,285 820,340 710,285" fill="#0e2140" stroke="#2c5594"/>
    <g fill="#4f8ef7">
      <circle cx="760" cy="322" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="770" cy="327" r="1.8"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="322" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="0.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- control plane -->
    <polygon points="820,190 940,250 820,310 700,250" fill="#10264a" stroke="#4f8ef7" stroke-width="1.5"/>
    <polygon points="820,190 940,250 820,310 700,250" fill="none" stroke="url(#beam)" stroke-width="2" opacity="0.8">
      <animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/>
    </polygon>

    <!-- helm wheel, squashed to sit on the iso plane -->
    <g transform="translate(820 250) scale(1 0.5)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <circle r="34" fill="none" stroke="#4f8ef7" stroke-width="5"/>
        <circle r="8" fill="#4f8ef7"/>
        <g stroke="#4f8ef7" stroke-width="5" stroke-linecap="round">
          <line x1="0" y1="-8" x2="0" y2="-46"/>
          <line x1="0" y1="-8" x2="0" y2="-46" transform="rotate(51.4)"/>
          <line x1="0" y1="-8" x2="0" y2="-46" transform="rotate(102.8)"/>
          <line x1="0" y1="-8" x2="0" y2="-46" transform="rotate(154.2)"/>
          <line x1="0" y1="-8" x2="0" y2="-46" transform="rotate(205.6)"/>
          <line x1="0" y1="-8" x2="0" y2="-46" transform="rotate(257)"/>
          <line x1="0" y1="-8" x2="0" y2="-46" transform="rotate(308.4)"/>
        </g>
      </g>
    </g>

    <!-- links pod <-> control plane -->
    <g stroke="#4f8ef7" stroke-opacity="0.55" fill="none">
      <path class="flow" d="M745,165 L800,240"/>
      <path class="flow" d="M820,120 L820,232"/>
      <path class="flow" d="M895,165 L840,240"/>
      <path class="flow" d="M960,215 L860,252"/>
      <path class="flow" d="M680,215 L780,252"/>
    </g>

    <!-- pods -->
    <use href="#cube" xlink:href="#cube" x="725" y="140"><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.2s" repeatCount="indefinite"/></use>
    <use href="#cube" xlink:href="#cube" x="800" y="95"><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.2s" begin=".6s" repeatCount="indefinite"/></use>
    <use href="#cube" xlink:href="#cube" x="875" y="140"><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.2s" begin="1.2s" repeatCount="indefinite"/></use>
    <use href="#cube" xlink:href="#cube" x="940" y="192"><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.2s" begin="1.8s" repeatCount="indefinite"/></use>
    <use href="#cube" xlink:href="#cube" x="660" y="192"><animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.2s" begin="2.4s" repeatCount="indefinite"/></use>
  </g>

  <!-- metrics panel -->
  <g class="fade" style="animation-delay:1.4s">
    <rect x="985" y="40" width="190" height="104" rx="8" fill="#0d1d37" stroke="#24467a"/>
    <circle cx="1000" cy="56" r="3" fill="#7ee787"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text class="mono" x="1010" y="60" font-size="10" fill="#7fa8e8">p99 latency · SLO 99.9%</text>
    <path class="spark" d="M997,100 L1012,92 L1024,98 L1036,84 L1048,90 L1060,76 L1072,88 L1084,80 L1096,94 L1108,70 L1120,82 L1132,74 L1144,86 L1160,72" fill="none" stroke="#4f8ef7" stroke-width="1.8" stroke-linejoin="round"/>
    <g fill="#4f8ef7" opacity="0.7">
      <rect x="998"  y="122" width="5" height="12"><animate attributeName="height" values="12;5;12" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="122;129;122" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="1008" y="118" width="5" height="16"><animate attributeName="height" values="16;8;16" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="118;126;118" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="1018" y="124" width="5" height="10"><animate attributeName="height" values="10;16;10" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="124;118;124" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="1028" y="120" width="5" height="14"><animate attributeName="height" values="14;6;14" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="120;128;120" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="1038" y="116" width="5" height="18"><animate attributeName="height" values="18;10;18" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="116;124;116" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="1048" y="122" width="5" height="12"><animate attributeName="height" values="12;17;12" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="122;117;122" dur="1s" repeatCount="indefinite"/></rect>
    </g>
    <text class="mono" x="1166" y="132" font-size="16" font-weight="700" fill="#7ee787" text-anchor="end">99.9%</text>

    <g class="mono" font-size="10" letter-spacing="1.5">
      <text class="lbl" x="985" y="168" style="animation-delay:0s">OBSERVABILITY</text>
      <text class="lbl" x="985" y="184" style="animation-delay:2s">METRICS · LOGS · TRACES</text>
    </g>
  </g>

  <!-- resilience waves -->
  <g class="fade" style="animation-delay:2s">
    <svg x="935" y="270" width="140" height="90" viewBox="0 0 140 90" overflow="hidden">
      <g class="wave" fill="none" stroke-width="1.4">
        <path d="M0,30 q15,-14 30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0" stroke="#4f8ef7" opacity="0.9"/>
        <path d="M0,48 q15,-10 30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0" stroke="#3b6fc4" opacity="0.7"/>
        <path d="M0,66 q15,-7 30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0" stroke="#2a4a7f" opacity="0.6"/>
      </g>
    </svg>
    <rect x="1082" y="276" width="1" height="78" fill="#24467a"/>
    <g class="mono" font-size="9.5" letter-spacing="1.2">
      <text class="lbl" x="1090" y="290" style="animation-delay:0s">SCALE</text>
      <text class="lbl" x="1090" y="312" style="animation-delay:2s">RESILIENCE</text>
      <text class="lbl" x="1090" y="334" style="animation-delay:4s">RELIABILITY</text>
      <text class="lbl" x="1090" y="356" style="animation-delay:6s">DX</text>
    </g>
  </g>
</svg>
