<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-label="Terminal: whoami and mission">
  <defs>
    <style>
      text { font: 15px 'JetBrains Mono', 'Fira Code', Consolas, monospace; fill: #c9d1d9; white-space: pre; }
      .p  { fill: #7ee787; font-weight: 700; }
      .c  { fill: #4f8ef7; font-weight: 700; }
      .k  { fill: #ff7b72; }
      .v  { fill: #a5d6ff; }
      .m  { fill: #8b949e; }
      .line { opacity: 0; animation: show 0.35s ease-out forwards; }
      @keyframes show { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
      .cursor { animation: blink 1s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
    </style>
  </defs>

  <rect width="960" height="390" rx="12" fill="#0b1628"/>
  <rect x="0.5" y="0.5" width="959" height="389" rx="12" fill="none" stroke="#1f3354"/>
  <rect width="960" height="36" rx="12" fill="#10233f"/>
  <rect y="24" width="960" height="12" fill="#10233f"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="480" y="23" class="m" text-anchor="middle" style="font-size:13px">nathan@infra: ~</text>

  <text class="line" x="24" y="70"  style="animation-delay:0.2s"><tspan class="p">nathan@infra</tspan><tspan class="m">:~$ </tspan>whoami</text>
  <text class="line" x="24" y="98"  style="animation-delay:0.8s"><tspan class="k">role</tspan>      <tspan class="v">Full Stack Infrastructure Engineer</tspan></text>
  <text class="line" x="24" y="122" style="animation-delay:1.0s"><tspan class="k">focus</tspan>     <tspan class="v">DevOps · SRE · Cloud · Security · Platform Engineering</tspan></text>
  <text class="line" x="24" y="146" style="animation-delay:1.2s"><tspan class="k">since</tspan>     <tspan class="v">2022 · 4+ years in production (crypto exchange, travel-tech)</tspan></text>
  <text class="line" x="24" y="170" style="animation-delay:1.4s"><tspan class="k">certs</tspan>     <tspan class="v">Certified Kubernetes Administrator (CKA)</tspan></text>
  <text class="line" x="24" y="194" style="animation-delay:1.6s"><tspan class="k">based</tspan>     <tspan class="v">Jakarta, Indonesia</tspan></text>

  <text class="line" x="24" y="236" style="animation-delay:2.2s"><tspan class="p">nathan@infra</tspan><tspan class="m">:~$ </tspan>cat mission.txt</text>
  <text class="line" x="24" y="264" style="animation-delay:2.8s"><tspan class="c">▸</tspan> Build <tspan class="c">scalable</tspan>, <tspan class="c">reliable</tspan> infrastructure that stays up under real load.</text>
  <text class="line" x="24" y="288" style="animation-delay:3.1s"><tspan class="c">▸</tspan> Put <tspan class="c">developer experience</tspan> first: golden paths, self-service, zero toil.</text>
  <text class="line" x="24" y="312" style="animation-delay:3.4s"><tspan class="c">▸</tspan> Help teams <tspan class="c">ship software faster</tspan>, safely, and with confidence.</text>

  <text class="line" x="24" y="354" style="animation-delay:4.0s"><tspan class="p">nathan@infra</tspan><tspan class="m">:~$ </tspan><tspan class="cursor" fill="#4f8ef7">█</tspan></text>
</svg>
