<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="GitHub Stats">
  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; }
    .title { font-size: 16px; font-weight: 700; fill: #4f8ef7; }
    .label { font-size: 13px; fill: #8b949e; }
    .value { font-size: 15px; font-weight: 700; fill: #e6edf3; }
    .row { opacity: 0; animation: in .45s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    .bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow .9s ease-out forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
  </style>
  <rect x="0.5" y="0.5" width="419" height="259" rx="12" fill="#0b1628" stroke="#1f3354"/>
  <text class="title" x="24" y="36">GitHub Stats</text>
  <g class="row" style="animation-delay:0.00s"><text x="24" y="72" style="font-size:14px;fill:#7ee787">★</text><text class="label" x="48" y="72">Total stars</text><text class="value" x="396" y="72" text-anchor="end">7</text></g>
  <g class="row" style="animation-delay:0.15s"><text x="24" y="99" style="font-size:14px;fill:#7ee787">⎇</text><text class="label" x="48" y="99">Total commits</text><text class="value" x="396" y="99" text-anchor="end">1,712</text></g>
  <g class="row" style="animation-delay:0.30s"><text x="24" y="126" style="font-size:14px;fill:#7ee787">⇄</text><text class="label" x="48" y="126">Pull requests</text><text class="value" x="396" y="126" text-anchor="end">3</text></g>
  <g class="row" style="animation-delay:0.45s"><text x="24" y="153" style="font-size:14px;fill:#7ee787">!</text><text class="label" x="48" y="153">Issues</text><text class="value" x="396" y="153" text-anchor="end">0</text></g>
  <g class="row" style="animation-delay:0.60s"><text x="24" y="180" style="font-size:14px;fill:#7ee787">▣</text><text class="label" x="48" y="180">Public repositories</text><text class="value" x="396" y="180" text-anchor="end">30</text></g>
  <g class="row" style="animation-delay:0.75s"><text x="24" y="207" style="font-size:14px;fill:#7ee787">◉</text><text class="label" x="48" y="207">Followers</text><text class="value" x="396" y="207" text-anchor="end">12</text></g>
  <text x="24" y="240" style="font-size:11px;fill:#5b6b85">on GitHub for 6+ years · updated 2026-11-21</text>
</svg>
