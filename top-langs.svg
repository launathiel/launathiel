<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="Top Languages">
  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; }
    .title { font-size: 16px; font-weight: 700; fill: #4f8ef7; }
    .label { font-size: 13px; fill: #8b949e; }
    .value { font-size: 15px; font-weight: 700; fill: #e6edf3; }
    .row { opacity: 0; animation: in .45s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    .bar { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow .9s ease-out forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
  </style>
  <rect x="0.5" y="0.5" width="419" height="259" rx="12" fill="#0b1628" stroke="#1f3354"/>
